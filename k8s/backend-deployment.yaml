apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-hos-backend
  namespace: ai-hos
  labels:
    app: ai-hos-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-hos-backend
  template:
    metadata:
      labels:
        app: ai-hos-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/ai-hos/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: ai-hos-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-hos-secrets
                  key: database-url
                  optional: true
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-hos-secrets
                  key: jwt-secret-key
                  optional: true
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-hos-secrets
                  key: llm-api-key
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/observability/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/observability/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-hos-backend-svc
  namespace: ai-hos
spec:
  type: ClusterIP
  selector:
    app: ai-hos-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
