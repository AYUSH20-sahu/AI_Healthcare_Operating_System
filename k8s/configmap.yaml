apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-hos-config
  namespace: ai-hos
data:
  APP_ENV: "production"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
  LLM_PROVIDER: "nvidia"
  LLM_MODEL: "meta/llama-3.1-70b-instruct"
  NEXT_PUBLIC_API_URL: "https://api.aihos.org/api/v1"
  NEXT_PUBLIC_APP_URL: "https://app.aihos.org"
