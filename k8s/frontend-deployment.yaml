apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-hos-frontend
  namespace: ai-hos
  labels:
    app: ai-hos-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-hos-frontend
  template:
    metadata:
      labels:
        app: ai-hos-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/ai-hos/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: ai-hos-config
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-hos-frontend-svc
  namespace: ai-hos
spec:
  type: ClusterIP
  selector:
    app: ai-hos-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
