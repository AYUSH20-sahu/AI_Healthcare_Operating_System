apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-hos-ingress
  namespace: ai-hos
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - app.aihos.org
        - api.aihos.org
      secretName: aihos-tls-cert
  rules:
    - host: app.aihos.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-hos-frontend-svc
                port:
                  number: 3000
    - host: api.aihos.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-hos-backend-svc
                port:
                  number: 8000
