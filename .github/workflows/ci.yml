name: CI/CD Pipeline (Horizon D)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: ai_hos
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_hos
  REDIS_URL: redis://localhost:6379/0
  JWT_SECRET_KEY: test_secret_key_for_ci_pipeline_min32chars
  JWT_ALGORITHM: HS256
  APP_ENV: test

jobs:
  # ── Job 1: Backend Lint & Automated Tests ──────────────────────────────────
  backend-lint-and-test:
    name: Job 1 - Backend Lint & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_hos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_hos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax & compilation
        run: |
          python -m compileall app/

      - name: Run backend lint (ruff)
        run: |
          ruff check .

      - name: Run backend tests with coverage
        run: |
          PYTHONPATH=. pytest -v --cov=app --cov-report=xml

      - name: Upload test coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./backend/coverage.xml
          flags: backend

  # ── Job 2: Frontend Lint, Typecheck & Next.js Build ────────────────────────
  frontend-lint-and-build:
    name: Job 2 - Frontend TypeScript & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Run frontend unit tests
        run: npm test --if-present

  # ── Job 3: Trivy Vulnerability & Secret Scanning ───────────────────────────
  trivy-and-secret-scanning:
    name: Job 3 - Trivy CVE & Secret Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy Vulnerability Scanner (Repo & Configs)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "table"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pip-audit (Python dependency CVE scan)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true

  # ── Job 4: Production Multi-Stage Container Build ──────────────────────────
  container-build:
    name: Job 4 - Production OCI Container Builds
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Backend image (Multi-stage + Non-root)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: |
            ai-hos-backend:latest
            ai-hos-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build production Frontend image (Next.js Standalone + Non-root)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: |
            ai-hos-frontend:latest
            ai-hos-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max