services:
  redis:
    image: redis:7-alpine
    container_name: ai-hos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ai-hos-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ai-hos-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@localhost:5432/ai_hos}
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev_insecure_jwt_secret_change_in_production_min64chars}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - LLM_PROVIDER=${LLM_PROVIDER:-nvidia}
      - LLM_API_KEY=${LLM_API_KEY:-${NVIDIA_API_KEY}}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - LLM_MODEL=${LLM_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
    volumes:
      - ./backend:/app
      - /app/__pycache__
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      ai-hos-network:
        aliases:
          - backend
          - ai-hos-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ai-hos-frontend
    restart: unless-stopped
    environment:
      - BACKEND_INTERNAL_URL=http://ai-hos-backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ai-hos-network
    command: npm run dev

volumes:
  redis_data:

networks:
  ai-hos-network:
    driver: bridge
