services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-hos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_hos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ai_hos}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ai-hos-network

  redis:
    image: redis:7-alpine
    container_name: ai-hos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ai-hos-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ai-hos-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/ai_hos}
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev_insecure_jwt_secret_change_in_production_min64chars}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - LLM_PROVIDER=${LLM_PROVIDER:-nvidia}
      - LLM_API_KEY=${LLM_API_KEY:-${NVIDIA_API_KEY}}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - LLM_MODEL=${LLM_MODEL:-meta/llama-3.1-70b-instruct}
    volumes:
      - ./backend:/app
      - /app/__pycache__
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      ai-hos-network:
        aliases:
          - backend
          - ai-hos-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ai-hos-frontend
    restart: unless-stopped
    environment:
      - BACKEND_INTERNAL_URL=http://ai-hos-backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ai-hos-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  ai-hos-network:
    driver: bridge
