# AI-HOS Production Docker Compose Configuration
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  redis:
    image: redis:7-alpine
    container_name: ai-hos-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-""}
    volumes:
      - redis_data_prod:/data
    # Note: No host port published; Redis is accessible ONLY internally by backend
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ai-hos-prod-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-hos-backend-prod
    restart: always
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required in production}
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set to a strong secret in production}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - SEED_INITIAL_ADMIN=false
      - SEED_DEMO_USERS=false
      - LLM_PROVIDER=${LLM_PROVIDER:-nvidia}
      - LLM_API_KEY=${LLM_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai-hos-prod-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --no-server-header

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-hos-frontend-prod
    restart: always
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ai-hos-prod-network
    command: npm run start

volumes:
  redis_data_prod:

networks:
  ai-hos-prod-network:
    driver: bridge
